<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Envíos — Reclamos RMN</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#4f7cff" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0d0f14;--surface:#13161e;--surface2:#1a1e29;--border:#252a38;
      --accent:#4f7cff;--warn:#f59e0b;--danger:#ef4444;--success:#10b981;
      --text:#e8ecf4;--text2:#8892aa;--text3:#4f5870;--r:12px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    nav{display:flex;align-items:center;justify-content:space-between;
      padding:16px 32px;border-bottom:1px solid var(--border);
      background:rgba(13,15,20,.9);backdrop-filter:blur(12px);
      position:sticky;top:0;z-index:100;}
    .nav-brand{display:flex;align-items:center;gap:10px;}
    .nav-title{font-family:'DM Serif Display',serif;font-size:1.1rem;}
    .nav-badge{font-size:.7rem;background:rgba(79,124,255,.15);color:var(--accent);
      padding:3px 10px;border-radius:100px;}
    .nav-back{font-size:.8rem;color:var(--text2);text-decoration:none;transition:color .2s;}
    .nav-back:hover{color:var(--text);}

    .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:16px;}
    .empty{text-align:center;padding:80px 20px;color:var(--text3);}
    .empty .big{font-size:2.6rem;margin-bottom:10px;}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      overflow:hidden;}
    .card-head{padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;
      gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
    .card-head h3{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.05rem;}
    .card-meta{font-size:.78rem;color:var(--text2);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;}
    .card-meta b{color:var(--text);font-weight:500;}
    .badge-warn{font-size:.7rem;background:rgba(245,158,11,.15);color:var(--warn);
      padding:4px 10px;border-radius:100px;white-space:nowrap;font-weight:600;}
    .card-body{display:flex;gap:0;}
    .preview{flex:1;min-width:0;background:#000;}
    .preview iframe{width:100%;height:480px;border:none;display:block;}
    .side{width:220px;flex-shrink:0;padding:16px;display:flex;flex-direction:column;gap:10px;
      border-left:1px solid var(--border);}
    @media (max-width:640px){.card-body{flex-direction:column}.side{width:100%;border-left:none;
      border-top:1px solid var(--border)}.preview iframe{height:340px}}

    .email-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
      padding:10px 12px;font-size:.82rem;}
    .email-box label{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;
      display:block;margin-bottom:4px;}
    .email-box .val{color:var(--text);word-break:break-all;}
    .email-box .missing{color:var(--danger);font-style:italic;}

    .btn{padding:11px 16px;border-radius:var(--r);border:none;cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;
      transition:all .2s;width:100%;}
    .btn-success{background:var(--success);color:#04140e;}
    .btn-success:hover{filter:brightness(1.08);transform:translateY(-1px);}
    .btn-success:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
    .btn-danger:hover{background:var(--danger);color:#fff;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
    .btn-ghost:hover{border-color:var(--text2);color:var(--text);}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
      padding:12px 20px;font-size:.85rem;opacity:0;pointer-events:none;transition:all .25s;z-index:999;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.ok{border-color:var(--success);color:var(--success);}
    .toast.error{border-color:var(--danger);color:var(--danger);}

    #pin-overlay{position:fixed;inset:0;z-index:9999;background:#0d0f14;
      display:none;align-items:center;justify-content:center;}
    #pin-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;
      padding:36px;width:340px;max-width:90vw;display:flex;flex-direction:column;gap:16px;
      text-align:center;}
    #pin-box .pin-icon{font-size:2rem;}
    #pin-box h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.15rem;}
    #pin-box p{font-size:.8rem;color:var(--text2);}
    #pin-input{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);
      border-radius:10px;color:var(--text);font-size:1.1rem;letter-spacing:.3em;text-align:center;
      outline:none;}
    #pin-input:focus{border-color:var(--accent);}
    #pin-error{font-size:.78rem;color:var(--danger);min-height:1.1em;}
  </style>
</head>
<body>
  <div id="pin-overlay">
    <div id="pin-box">
      <div class="pin-icon">🔒</div>
      <h2>Acceso restringido</h2>
      <p>Esta sección muestra informes reales de pacientes. Ingresá el PIN de administrativo para continuar.</p>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" />
      <div id="pin-error"></div>
      <button class="btn btn-success" id="btn-pin-entrar">Entrar</button>
    </div>
  </div>

  <nav>
    <div class="nav-brand">
      <span>📤</span>
      <span class="nav-title">Envíos de informes</span>
      <span class="nav-badge" id="contadorBadge">Reclamos RMN</span>
    </div>
    <a href="administrativo.html" class="nav-back">← Volver a Administrativo</a>
  </nav>

  <div class="wrap" id="wrap">
    <div class="spinner"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script>
    let _actual = [];
    const PIN_KEY = 'reclamos_envios_pin';

    function getPin() { return sessionStorage.getItem(PIN_KEY) || ''; }

    function pedirPin() {
      const overlay = document.getElementById('pin-overlay');
      const input = document.getElementById('pin-input');
      const error = document.getElementById('pin-error');
      overlay.style.display = 'flex';
      input.value = '';
      input.focus();

      async function intentar() {
        const pin = input.value.trim();
        if (!pin) return;
        error.textContent = '';
        try {
          await getInformesListos(pin); // valida contra el Apps Script
          sessionStorage.setItem(PIN_KEY, pin);
          overlay.style.display = 'none';
          cargar();
        } catch (err) {
          error.textContent = 'PIN incorrecto';
          input.value = '';
          input.focus();
        }
      }

      document.getElementById('btn-pin-entrar').onclick = intentar;
      input.onkeydown = e => { if (e.key === 'Enter') intentar(); };
    }

    function toast(msg, tipo) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (tipo ? ' ' + tipo : '');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
    }

    function previewUrl(driveId) {
      return `https://drive.google.com/file/d/${driveId}/preview`;
    }

    function render(lista) {
      const wrap = document.getElementById('wrap');
      document.getElementById('contadorBadge').textContent =
        lista.length + (lista.length === 1 ? ' informe pendiente' : ' informes pendientes');

      if (!lista.length) {
        wrap.innerHTML = `
          <div class="empty">
            <div class="big">✅</div>
            <div>No hay informes esperando revisión</div>
          </div>`;
        return;
      }

      wrap.innerHTML = lista.map(r => `
        <div class="card" data-id="${r.id}">
          <div class="card-head">
            <div>
              <h3>${r.apellido}, ${r.nombre}</h3>
              <div class="card-meta">
                <span>DNI <b>${r.dni}</b></span>
                <span>Estudio <b>${r.estudio}</b></span>
                <span>Fecha <b>${r.fechaEstudio}</b></span>
              </div>
            </div>
            <span class="badge-warn">⏳ Esperando revisión</span>
          </div>
          <div class="card-body">
            <div class="preview">
              <iframe src="${previewUrl(r.informeDriveId)}" loading="lazy" allow="autoplay"></iframe>
            </div>
            <div class="side">
              <div class="email-box">
                <label>Enviar a</label>
                <div class="val ${r.email ? '' : 'missing'}">${r.email || 'Sin email cargado — no se puede enviar'}</div>
              </div>
              <button class="btn btn-success" data-confirmar="${r.id}" ${r.email ? '' : 'disabled'}>
                ✓ Confirmar y enviar
              </button>
              <button class="btn btn-danger" data-rechazar="${r.id}">✕ Rechazar</button>
              <a href="${previewUrl(r.informeDriveId)}" target="_blank" rel="noopener" class="btn btn-ghost"
                style="text-decoration:none;text-align:center;display:block">↗ Abrir en pestaña</a>
            </div>
          </div>
        </div>
      `).join('');

      wrap.querySelectorAll('[data-confirmar]').forEach(btn => {
        btn.addEventListener('click', () => onConfirmar(btn.dataset.confirmar, btn));
      });
      wrap.querySelectorAll('[data-rechazar]').forEach(btn => {
        btn.addEventListener('click', () => onRechazar(btn.dataset.rechazar));
      });
    }

    function _sesionVencida() {
      sessionStorage.removeItem(PIN_KEY);
      toast('El PIN cambió o venció — ingresalo de nuevo', 'error');
      pedirPin();
    }

    async function cargar() {
      try {
        _actual = await getInformesListos(getPin());
        render(_actual);
      } catch (err) {
        if (err.message === 'PIN inválido') { _sesionVencida(); return; }
        document.getElementById('wrap').innerHTML =
          `<div class="empty"><div class="big">⚠️</div><div>Error: ${err.message}</div></div>`;
      }
    }

    async function onConfirmar(id, btn) {
      const reclamo = _actual.find(r => r.id === id);
      if (!confirm(`¿Confirmar el envío del informe a ${reclamo ? reclamo.email : 'este contacto'}?\n\nEsta acción manda el mail de verdad y no se puede deshacer.`)) return;
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        await confirmarEnvioInforme(id, getPin());
        toast('Informe enviado ✓', 'ok');
        cargar();
      } catch (err) {
        if (err.message === 'PIN inválido') { _sesionVencida(); return; }
        toast('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = '✓ Confirmar y enviar';
      }
    }

    async function onRechazar(id) {
      const motivo = prompt('¿Por qué se rechaza? (el bot va a volver a intentarlo en la próxima corrida)');
      if (motivo === null) return;
      try {
        await rechazarInforme(id, motivo || 'Sin motivo especificado', getPin());
        toast('Informe rechazado — vuelve a quedar pendiente', 'ok');
        cargar();
      } catch (err) {
        if (err.message === 'PIN inválido') { _sesionVencida(); return; }
        toast('Error: ' + err.message, 'error');
      }
    }

    function iniciar() {
      if (getPin()) cargar();
      else pedirPin();
    }

    verificarConfig(iniciar);
  </script>
</body>
</html>
