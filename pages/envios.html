<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Envíos — Reclamos RMN</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#4f7cff" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0d0f14;--surface:#13161e;--surface2:#1a1e29;--border:#252a38;
      --accent:#4f7cff;--warn:#f59e0b;--danger:#ef4444;--success:#10b981;
      --text:#e8ecf4;--text2:#8892aa;--text3:#4f5870;--r:12px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    nav{display:flex;align-items:center;justify-content:space-between;
      padding:16px 32px;border-bottom:1px solid var(--border);
      background:rgba(13,15,20,.9);backdrop-filter:blur(12px);
      position:sticky;top:0;z-index:100;}
    .nav-brand{display:flex;align-items:center;gap:10px;}
    .nav-title{font-family:'DM Serif Display',serif;font-size:1.1rem;}
    .nav-badge{font-size:.7rem;background:rgba(79,124,255,.15);color:var(--accent);
      padding:3px 10px;border-radius:100px;}
    .nav-back{font-size:.8rem;color:var(--text2);text-decoration:none;transition:color .2s;}
    .nav-back:hover{color:var(--text);}

    .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:16px;}
    .empty{text-align:center;padding:80px 20px;color:var(--text3);}
    .empty .big{font-size:2.6rem;margin-bottom:10px;}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      overflow:hidden;}
    .card-head{padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;
      gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
    .card-head h3{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.05rem;}
    .card-meta{font-size:.78rem;color:var(--text2);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;}
    .card-meta b{color:var(--text);font-weight:500;}
    .badge-warn{font-size:.7rem;background:rgba(245,158,11,.15);color:var(--warn);
      padding:4px 10px;border-radius:100px;white-space:nowrap;font-weight:600;}
    .card-body{display:flex;gap:0;}
    .preview{flex:1;min-width:0;background:#000;}
    .preview iframe{width:100%;height:480px;border:none;display:block;}
    .side{width:220px;flex-shrink:0;padding:16px;display:flex;flex-direction:column;gap:10px;
      border-left:1px solid var(--border);}
    @media (max-width:640px){.card-body{flex-direction:column}.side{width:100%;border-left:none;
      border-top:1px solid var(--border)}.preview iframe{height:340px}}

    .email-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
      padding:10px 12px;font-size:.82rem;}
    .email-box label{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;
      display:block;margin-bottom:4px;}
    .email-box .val{color:var(--text);word-break:break-all;}
    .email-box .missing{color:var(--danger);font-style:italic;}
    .email-box .val.editable{cursor:pointer;}
    .email-box .val.editable:hover{text-decoration:underline;}
    .email-box .edit-row{display:flex;gap:6px;margin-top:4px;}
    .email-box input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:.82rem;padding:6px 8px;font-family:'DM Sans',sans-serif;}
    .email-box input:focus{outline:none;border-color:var(--accent);}
    .email-box .edit-row button{flex-shrink:0;padding:6px 10px;border-radius:8px;border:none;
      cursor:pointer;font-size:.78rem;font-family:'DM Sans',sans-serif;}
    .email-box .edit-row .save{background:var(--success);color:#04140e;}
    .email-box .edit-row .cancel{background:transparent;border:1px solid var(--border);color:var(--text2);}

    .btn{padding:11px 16px;border-radius:var(--r);border:none;cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;
      transition:all .2s;width:100%;}
    .btn-success{background:var(--success);color:#04140e;}
    .btn-success:hover{filter:brightness(1.08);transform:translateY(-1px);}
    .btn-success:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
    .btn-danger:hover{background:var(--danger);color:#fff;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
    .btn-ghost:hover{border-color:var(--text2);color:var(--text);}

    #rebotadosWrap:not(:empty){display:flex;flex-direction:column;gap:16px;}
    #listosWrap{display:flex;flex-direction:column;gap:16px;}
    .section-title{font-family:'DM Serif Display',serif;font-size:1rem;font-weight:400;
      color:var(--danger);display:flex;align-items:center;gap:8px;margin-top:8px;}
    .badge-danger{font-size:.7rem;background:rgba(239,68,68,.15);color:var(--danger);
      padding:4px 10px;border-radius:100px;white-space:nowrap;font-weight:600;}
    .rebote-card{border-color:rgba(239,68,68,.35);}
    .rebote-motivo{font-size:.75rem;color:var(--text2);margin-top:6px;}
    .rebote-body{padding:16px 20px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
    .rebote-body .email-box{flex:1;min-width:200px;}
    .rebote-body .btn{width:auto;white-space:nowrap;}

    .nav-toggle{background:none;border:1px solid var(--border);color:var(--text2);
      font-family:'DM Sans',sans-serif;font-size:.8rem;border-radius:100px;padding:6px 14px;
      cursor:pointer;transition:all .2s;}
    .nav-toggle:hover{border-color:var(--accent);color:var(--text);}
    .enviados-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      overflow:hidden;}
    .enviados-panel .card-head{padding:14px 20px;}
    .enviados-list{max-height:360px;overflow-y:auto;}
    .enviado-row{display:flex;align-items:center;gap:14px;padding:10px 20px;font-size:.82rem;
      border-top:1px solid var(--border);flex-wrap:wrap;}
    .enviado-row .nom{flex:1;min-width:140px;color:var(--text);}
    .enviado-row .email{color:var(--text2);word-break:break-all;flex:1;min-width:160px;}
    .enviado-row .fecha{color:var(--text3);font-size:.76rem;white-space:nowrap;}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
      padding:12px 20px;font-size:.85rem;opacity:0;pointer-events:none;transition:all .25s;z-index:999;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.ok{border-color:var(--success);color:var(--success);}
    .toast.error{border-color:var(--danger);color:var(--danger);}
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">
      <span>📤</span>
      <span class="nav-title">Envíos de informes</span>
      <span class="nav-badge" id="contadorBadge">Reclamos RMN</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <button class="nav-toggle" id="btnVerEnviados">📋 Ver enviados</button>
      <a href="administrativo.html" class="nav-back">← Volver a Administrativo</a>
    </div>
  </nav>

  <div class="wrap" id="wrap">
    <div id="enviadosPanel" style="display:none"></div>
    <div id="rebotadosWrap"></div>
    <div id="listosWrap"><div class="spinner"></div></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/api.js"></script>
  <script>
    let _actual = [];
    let _rebotados = [];
    let _enviados = null; // null = todavía no se pidió

    function _buscar(id) {
      return _actual.find(r => r.id === id) || _rebotados.find(r => r.id === id);
    }

    function toast(msg, tipo) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (tipo ? ' ' + tipo : '');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
    }

    // El PDF ya no vive en Drive con link público — sale de la propia API,
    // atrás del mismo PIN que protege todo lo demás (ver /reclamos/:id/informe
    // en reclamos-rmn-backend).
    function previewUrl(id) {
      return `${getApiUrl()}/reclamos/${id}/informe?pin=${encodeURIComponent(getPin())}`;
    }

    function render(lista) {
      const wrap = document.getElementById('listosWrap');
      document.getElementById('contadorBadge').textContent =
        lista.length + (lista.length === 1 ? ' informe pendiente' : ' informes pendientes');

      if (!lista.length) {
        wrap.innerHTML = `
          <div class="empty">
            <div class="big">✅</div>
            <div>No hay informes esperando revisión</div>
          </div>`;
        return;
      }

      wrap.innerHTML = lista.map(r => `
        <div class="card" data-id="${r.id}">
          <div class="card-head">
            <div>
              <h3>${r.apellido}, ${r.nombre}</h3>
              <div class="card-meta">
                <span>DNI <b>${r.dni}</b></span>
                <span>Estudio <b>${r.estudio}</b></span>
                <span>Fecha <b>${r.fechaEstudio}</b></span>
              </div>
            </div>
            <span class="badge-warn">⏳ Esperando revisión</span>
          </div>
          <div class="card-body">
            <div class="preview">
              <iframe src="${previewUrl(r.id)}" loading="lazy" allow="autoplay"></iframe>
            </div>
            <div class="side">
              <div class="email-box" data-email-box="${r.id}">
                <label>Enviar a</label>
                <div class="val ${r.email ? 'editable' : 'missing'}" data-email-val="${r.id}">${r.email || 'Sin email cargado — click para agregar'}</div>
              </div>
              <button class="btn btn-success" data-confirmar="${r.id}" ${r.email ? '' : 'disabled'}>
                ✓ Confirmar y enviar
              </button>
              <button class="btn btn-danger" data-rechazar="${r.id}">✕ Rechazar</button>
              <a href="${previewUrl(r.id)}" target="_blank" rel="noopener" class="btn btn-ghost"
                style="text-decoration:none;text-align:center;display:block">↗ Abrir en pestaña</a>
            </div>
          </div>
        </div>
      `).join('');

      wrap.querySelectorAll('[data-confirmar]').forEach(btn => {
        btn.addEventListener('click', () => onConfirmar(btn.dataset.confirmar, btn));
      });
      wrap.querySelectorAll('[data-rechazar]').forEach(btn => {
        btn.addEventListener('click', () => onRechazar(btn.dataset.rechazar));
      });
      wrap.querySelectorAll('[data-email-val]').forEach(el => {
        el.addEventListener('click', () => onEditarEmail(el.dataset.emailVal));
      });
    }

    // El mail rebotó, así que ya no queda PDF (se borró al mandarlo) — acá
    // solo se corrige el destinatario y se pide que el bot lo vuelva a
    // bajar y armar desde cero (reintentarEnvioInforme).
    function renderRebotados(lista) {
      const wrap = document.getElementById('rebotadosWrap');
      if (!lista.length) { wrap.innerHTML = ''; return; }

      wrap.innerHTML = `
        <div class="section-title">⚠️ ${lista.length} ${lista.length === 1 ? 'informe rebotó' : 'informes rebotaron'} — revisar el mail</div>
        ${lista.map(r => `
          <div class="card rebote-card" data-id="${r.id}">
            <div class="card-head">
              <div>
                <h3>${r.apellido}, ${r.nombre}</h3>
                <div class="card-meta">
                  <span>DNI <b>${r.dni}</b></span>
                  <span>Estudio <b>${r.estudio}</b></span>
                </div>
                <div class="rebote-motivo">${(r.observaciones || '').split(' | ').pop() || 'El mail rebotó'}</div>
              </div>
              <span class="badge-danger">✕ Rebotó</span>
            </div>
            <div class="rebote-body">
              <div class="email-box" data-email-box="${r.id}">
                <label>Enviar a</label>
                <div class="val editable" data-email-val="${r.id}">${r.email || 'Sin email cargado — click para agregar'}</div>
              </div>
              <button class="btn btn-success" data-reintentar="${r.id}">↻ Reintentar envío</button>
            </div>
          </div>
        `).join('')}`;

      wrap.querySelectorAll('[data-reintentar]').forEach(btn => {
        btn.addEventListener('click', () => onReintentar(btn.dataset.reintentar, btn));
      });
      wrap.querySelectorAll('[data-email-val]').forEach(el => {
        el.addEventListener('click', () => onEditarEmail(el.dataset.emailVal));
      });
    }

    async function toggleEnviados() {
      const panel = document.getElementById('enviadosPanel');
      const abierto = panel.style.display !== 'none';
      if (abierto) { panel.style.display = 'none'; return; }

      panel.style.display = 'block';
      if (_enviados === null) {
        panel.innerHTML = `<div class="spinner"></div>`;
        try {
          _enviados = await getInformesEnviados(30);
        } catch (err) {
          if (err.message === 'PIN inválido') { _sesionVencida(); return; }
          panel.innerHTML = `<div class="empty"><div class="big">⚠️</div><div>Error: ${err.message}</div></div>`;
          return;
        }
      }
      renderEnviados(_enviados);
    }

    function renderEnviados(lista) {
      const panel = document.getElementById('enviadosPanel');
      if (!lista.length) {
        panel.innerHTML = `<div class="empty" style="padding:30px 20px;">
          <div>No se mandó ningún informe en los últimos 30 días</div></div>`;
        return;
      }
      panel.innerHTML = `
        <div class="enviados-panel">
          <div class="card-head"><h3>✓ Enviados — últimos 30 días</h3></div>
          <div class="enviados-list">
            ${lista.map(r => `
              <div class="enviado-row">
                <span class="nom">${r.apellido}, ${r.nombre} · DNI ${r.dni}</span>
                <span class="email">${r.email || '—'}</span>
                <span class="fecha">${r.informeFecha}</span>
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    async function onReintentar(id, btn) {
      const reclamo = _buscar(id);
      if (!reclamo || !reclamo.email) { toast('Cargá un email antes de reintentar', 'error'); return; }
      btn.disabled = true;
      btn.textContent = 'Reintentando…';
      try {
        await reintentarEnvioInforme(id);
        toast('Reencolado — el bot va a volver a bajar el informe y armarlo', 'ok');
        cargar();
      } catch (err) {
        if (err.message === 'PIN inválido') { _sesionVencida(); return; }
        toast('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = '↻ Reintentar envío';
      }
    }

    function onEditarEmail(id) {
      const reclamo = _buscar(id);
      const box = document.querySelector(`[data-email-box="${id}"]`);
      if (!box) return;
      box.innerHTML = `
        <label>Enviar a</label>
        <div class="edit-row">
          <input type="email" data-email-input="${id}" placeholder="paciente@mail.com" value="${reclamo && reclamo.email ? reclamo.email : ''}" />
          <button class="save" data-guardar-email="${id}">Guardar</button>
          <button class="cancel" data-cancelar-email="${id}">✕</button>
        </div>`;
      const input = box.querySelector('input');
      input.focus();
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') onGuardarEmail(id);
        if (e.key === 'Escape') _reRenderTodo();
      });
      box.querySelector('[data-guardar-email]').addEventListener('click', () => onGuardarEmail(id));
      box.querySelector('[data-cancelar-email]').addEventListener('click', () => _reRenderTodo());
    }

    function _reRenderTodo() {
      render(_actual);
      renderRebotados(_rebotados);
    }

    async function onGuardarEmail(id) {
      const box = document.querySelector(`[data-email-box="${id}"]`);
      const input = box.querySelector('input');
      const email = input.value.trim();
      if (!email) { toast('Ingresá un email', 'error'); return; }
      const saveBtn = box.querySelector('[data-guardar-email]');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando…';
      try {
        await updateReclamo(id, { email });
        const reclamo = _buscar(id);
        if (reclamo) reclamo.email = email;
        _reRenderTodo();
        toast('Email guardado ✓', 'ok');
      } catch (err) {
        if (err.message === 'PIN inválido') { _sesionVencida(); return; }
        toast('Error: ' + err.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Guardar';
      }
    }

    // Si el PIN cambió/venció a mitad de sesión, apiGet/apiPost ya lo
    // limpiaron (ver js/api.js) — acá solo hace falta volver a pedirlo.
    function _sesionVencida() {
      toast('El PIN cambió o venció — ingresalo de nuevo', 'error');
      verificarPin(cargar);
    }

    async function cargar() {
      try {
        [_actual, _rebotados] = await Promise.all([getInformesListos(), getInformesRebotados()]);
        render(_actual);
        renderRebotados(_rebotados);
      } catch (err) {
        if (err.message === 'PIN inválido') { _sesionVencida(); return; }
        document.getElementById('listosWrap').innerHTML =
          `<div class="empty"><div class="big">⚠️</div><div>Error: ${err.message}</div></div>`;
      }
    }

    async function onConfirmar(id, btn) {
      const reclamo = _actual.find(r => r.id === id);
      if (!confirm(`¿Enviar el informe a ${reclamo ? reclamo.email : 'este contacto'}?\n\nEsta acción manda el mail de verdad.`)) return;
      if (!confirm(`Al enviarlo se va a borrar el PDF temporal cargado y el reclamo va a pasar a "enviado". No se puede deshacer.\n\n¿Confirmás?`)) return;
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        await confirmarEnvioInforme(id);
        _enviados = null; // el historial quedó desactualizado
        toast('Informe enviado ✓', 'ok');
        cargar();
      } catch (err) {
        if (err.message === 'PIN inválido') { _sesionVencida(); return; }
        toast('Error: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = '✓ Confirmar y enviar';
      }
    }

    async function onRechazar(id) {
      const motivo = prompt('¿Por qué se rechaza? (el bot va a volver a intentarlo en la próxima corrida)');
      if (motivo === null) return;
      try {
        await rechazarInforme(id, motivo || 'Sin motivo especificado');
        toast('Informe rechazado — vuelve a quedar pendiente', 'ok');
        cargar();
      } catch (err) {
        if (err.message === 'PIN inválido') { _sesionVencida(); return; }
        toast('Error: ' + err.message, 'error');
      }
    }

    document.getElementById('btnVerEnviados').addEventListener('click', toggleEnviados);
    verificarConfig(() => verificarPin(cargar));
  </script>
</body>
</html>
