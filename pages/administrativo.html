<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrativo — Reclamos RMN</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#4f7cff" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0d0f14;--surface:#13161e;--surface2:#1a1e29;--border:#252a38;
      --accent:#4f7cff;--warn:#f59e0b;--danger:#ef4444;--success:#10b981;
      --recitar:#06b6d4;--text:#e8ecf4;--text2:#8892aa;--text3:#4f5870;--r:12px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    nav{display:flex;align-items:center;justify-content:space-between;
      padding:16px 32px;border-bottom:1px solid var(--border);
      background:rgba(13,15,20,.9);backdrop-filter:blur(12px);
      position:sticky;top:0;z-index:100;}
    .nav-brand{display:flex;align-items:center;gap:10px;}
    .nav-title{font-family:'DM Serif Display',serif;font-size:1.1rem;}
    .nav-badge{font-size:.7rem;background:rgba(79,124,255,.15);color:var(--accent);
      padding:3px 10px;border-radius:100px;}
    .nav-back{font-size:.8rem;color:var(--text2);text-decoration:none;transition:color .2s;}
    .nav-analitica-btn{display:inline-flex;align-items:center;gap:6px;
      padding:7px 14px;border-radius:100px;
      background:rgba(79,124,255,.12);border:1px solid rgba(79,124,255,.25);
      color:var(--accent);text-decoration:none;
      font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:600;
      transition:all .2s;}
    .nav-analitica-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
    .nav-back:hover{color:var(--text);}
    .layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 57px);}
    .sidebar{border-right:1px solid var(--border);padding:24px;display:flex;
      flex-direction:column;gap:16px;position:sticky;top:57px;
      height:calc(100vh - 57px);overflow-y:auto;}
    .sidebar h2{font-family:'DM Serif Display',serif;font-size:1.1rem;font-weight:400;}
    label{font-size:.78rem;color:var(--text2);font-weight:500;
      letter-spacing:.03em;text-transform:uppercase;}
    input,select,textarea{width:100%;padding:10px 14px;background:var(--surface2);
      border:1px solid var(--border);border-radius:var(--r);color:var(--text);
      font-family:'DM Sans',sans-serif;font-size:.875rem;transition:border-color .2s;outline:none;}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);}
    textarea{resize:vertical;min-height:60px;}
    select option{background:#1a1e29;}
    .field{display:flex;flex-direction:column;gap:6px;}
    .btn{padding:11px 20px;border-radius:var(--r);border:none;cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:.875rem;font-weight:500;
      transition:all .2s;width:100%;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{background:#3a68f0;transform:translateY(-1px);}
    .btn-primary:disabled{background:#2a3a6a;color:#5a6a9a;cursor:not-allowed;transform:none;}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
    .btn-ghost:hover{border-color:var(--text2);color:var(--text);}

    /* Stats */
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .stat-box{background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--r);padding:12px;text-align:center;
    transition:border-color .2s,transform .2s;}
    .stat-box:hover{border-color:var(--accent);transform:translateY(-2px);}
    .stat-num{font-size:1.5rem;font-weight:600;}
    .stat-num.danger{color:var(--danger);}
    .stat-num.warn{color:var(--warn);}
    .stat-num.success{color:var(--success);}
    .stat-num.accent{color:var(--accent);}
    .stat-label{font-size:.7rem;color:var(--text2);margin-top:2px;}

    /* Tipos reclamo */
    .reclamo-tipos{display:flex;flex-direction:column;gap:8px;}
    .reclamo-tipo-label{font-size:.78rem;color:var(--text2);font-weight:500;
      letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px;}
    .tipo-check{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
      background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);
      cursor:pointer;transition:all .2s;user-select:none;}
    .tipo-check:hover{border-color:var(--accent);}
    .tipo-check input[type=checkbox]{width:16px;height:16px;min-width:16px;
      accent-color:var(--accent);cursor:pointer;margin-top:2px;}
    .tipo-check.checked{border-color:var(--accent);background:rgba(79,124,255,.08);}
    .tipo-check.urgente.checked{border-color:var(--danger);background:rgba(239,68,68,.08);}
    .tipo-check.diagnostico.checked{border-color:#a78bfa;background:rgba(167,139,250,.08);}
    .tipo-check-icon{font-size:1rem;flex-shrink:0;}
    .tipo-check-text{display:flex;flex-direction:column;gap:2px;}
    .tipo-check-title{font-size:.85rem;font-weight:600;color:var(--text);}
    .tipo-check-desc{font-size:.72rem;color:var(--text2);line-height:1.4;}
    .turno-fecha-wrap{display:none;margin-top:6px;}
    .turno-fecha-wrap.visible{display:block;}

    /* Main */
    .main{padding:24px;display:flex;flex-direction:column;gap:20px;}

    /* Top bar */
    .top-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .search-wrap{flex:1;position:relative;min-width:220px;}
    .search-wrap input{padding-left:36px;}
    .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);
      color:var(--text3);font-size:14px;}
    .filter-select{width:160px;}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
    .filter-btn{padding:8px 14px;border-radius:100px;border:1px solid var(--border);
      background:var(--surface2);color:var(--text2);cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;
      transition:all .2s;white-space:nowrap;}
    .filter-btn:hover{border-color:var(--accent);color:var(--text);}
    .filter-btn.active{background:rgba(79,124,255,.15);border-color:var(--accent);color:var(--accent);}
    .reclamos-list{display:flex;flex-direction:column;gap:10px;}

    /* Cards reclamos */
    .reclamo-card{background:var(--surface);border:1px solid var(--border);
      border-radius:var(--r);padding:16px 20px;
      display:grid;grid-template-columns:auto 1fr auto;
      gap:16px;align-items:start;transition:all .2s;cursor:pointer;}
    .reclamo-card:hover{border-color:var(--accent);background:var(--surface2);}
    .reclamo-card.resuelto{opacity:.65;}
    .reclamo-card.entregado{opacity:.45;}
    .reclamo-card.urgente-border{border-left:3px solid var(--danger);}
    .reclamo-card.revisado-admin{opacity:.6;border-left:3px solid var(--accent);}
    .reclamo-card.recitado-borde{border-left:3px solid var(--recitar);}
    .card-num{font-size:.75rem;color:var(--text3);font-weight:600;min-width:40px;}
    .card-num-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
    .chk-revisar{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);}
    .card-paciente{font-weight:600;font-size:.95rem;}
    .card-estudio{font-size:.8rem;color:var(--text2);margin-top:2px;}
    .card-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
    .badge{font-size:.68rem;padding:3px 8px;border-radius:100px;font-weight:500;white-space:nowrap;}
    .badge-pendiente{background:rgba(245,158,11,.12);color:var(--warn);}
    .badge-resuelto{background:rgba(16,185,129,.12);color:var(--success);}
    .badge-entregado{background:rgba(79,124,255,.12);color:var(--accent);}
    .badge-turno{background:rgba(239,68,68,.1);color:var(--danger);}
    .badge-dias{background:rgba(255,255,255,.06);color:var(--text2);}
    .badge-dias-alerta{background:rgba(245,158,11,.12);color:var(--warn);}
    .badge-dias-critico{background:rgba(239,68,68,.15);color:var(--danger);font-weight:600;}
    .badge-origen{background:rgba(255,255,255,.05);color:var(--text3);}
    .badge-revisado{background:rgba(79,124,255,.12);color:var(--accent);}
    .badge-recitado{background:rgba(6,182,212,.12);color:var(--recitar);}
    /* Secundarios: describen el motivo del reclamo, no su urgencia —
       mismo tono neutro que badge-dias para que no compitan con
       estado/turno/retraso, que son los que importan para priorizar */
    .badge-diag{background:rgba(255,255,255,.06);color:var(--text2);}
    .badge-inform{background:rgba(255,255,255,.06);color:var(--text2);}
    .card-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
    .btn-sm{padding:6px 12px;border-radius:8px;border:none;cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:500;
      transition:all .2s;white-space:nowrap;}
    .btn-sm-blue{background:rgba(79,124,255,.12);color:var(--accent);}
    .btn-sm-blue:hover{background:var(--accent);color:#fff;}
    .btn-sm-green{background:rgba(16,185,129,.12);color:var(--success);}
    .btn-sm-green:hover{background:var(--success);color:#fff;}
    .btn-sm-gray{background:rgba(255,255,255,.05);color:var(--text2);}
    .btn-sm-gray:hover{background:rgba(255,255,255,.1);color:var(--text);}

    /* Recitados admin */
    .recitado-admin-card{background:var(--surface);border:1px solid rgba(6,182,212,.25);
      border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
    .recitado-admin-header{display:flex;align-items:flex-start;gap:12px;}
    .recitado-code-badge{font-size:.7rem;background:rgba(6,182,212,.12);color:var(--recitar);
      padding:3px 10px;border-radius:100px;font-weight:600;white-space:nowrap;margin-left:auto;}
    .recitado-motivo-box{font-size:.82rem;color:var(--text2);
      background:rgba(6,182,212,.06);border:1px solid rgba(6,182,212,.12);
      border-radius:8px;padding:10px 14px;line-height:1.5;}
    .recitado-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .btn-agenda{padding:8px 16px;border-radius:8px;
      background:rgba(79,124,255,.12);border:1px solid rgba(79,124,255,.25);
      color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif;
      font-size:.82rem;font-weight:500;transition:all .2s;text-decoration:none;
      display:inline-flex;align-items:center;gap:6px;}
    .btn-agenda:hover{background:var(--accent);color:#fff;}
    .btn-confirmar-turno{padding:8px 16px;border-radius:8px;
      background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.25);
      color:var(--recitar);cursor:pointer;font-family:'DM Sans',sans-serif;
      font-size:.82rem;font-weight:500;transition:all .2s;}
    .btn-confirmar-turno:hover{background:var(--recitar);color:#fff;}
    .btn-confirmar-turno:disabled{opacity:.5;cursor:not-allowed;}
    input.fecha-rctr{padding:8px 12px;background:var(--surface2);
      border:1px solid var(--border);border-radius:8px;color:var(--text);
      font-family:'DM Sans',sans-serif;font-size:.82rem;outline:none;width:auto;}
    input.fecha-rctr:focus{border-color:var(--recitar);}

    /* Vinculado */
    .vinculado-info{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);
      border-radius:var(--r);padding:10px 14px;font-size:.78rem;color:var(--success);
      display:none;}
    .vinculado-info.visible{display:block;}

    /* Historial por DNI */
    .historial-dni{display:none;flex-direction:column;gap:6px;
      max-height:220px;overflow-y:auto;
      background:var(--surface2);border:1px solid var(--border);
      border-radius:var(--r);padding:10px 12px;}
    .historial-dni.visible{display:flex;}
    .historial-dni-label{font-size:.68rem;font-weight:600;letter-spacing:.03em;
      text-transform:uppercase;color:var(--text3);}
    .historial-dni-item{display:flex;flex-direction:column;gap:2px;
      padding:6px 0;border-bottom:1px solid var(--border);font-size:.76rem;}
    .historial-dni-item:last-child{border-bottom:none;padding-bottom:0;}
    .historial-dni-item .hdi-top{display:flex;justify-content:space-between;gap:8px;
      color:var(--text2);}
    .historial-dni-item .hdi-estudio{color:var(--text3);}

    /* Empty / Loading */
    .empty{text-align:center;color:var(--text2);padding:60px 20px;}
    .empty span{font-size:3rem;display:block;margin-bottom:12px;}
    .loading{display:flex;align-items:center;justify-content:center;gap:10px;
      padding:60px;color:var(--text2);font-size:.9rem;}
    .spinner{width:20px;height:20px;border:2px solid var(--border);
      border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);
      display:flex;align-items:center;justify-content:center;
      z-index:200;backdrop-filter:blur(4px);
      opacity:0;pointer-events:none;transition:opacity .25s;}
    .modal-overlay.open{opacity:1;pointer-events:all;}
    .modal{background:var(--surface);border:1px solid var(--border);
      border-radius:20px;padding:28px;width:520px;max-width:95vw;
      max-height:90vh;overflow-y:auto;
      transform:scale(.95);transition:transform .25s;}
    .modal-overlay.open .modal{transform:scale(1);}
    .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
    .modal-title{font-family:'DM Serif Display',serif;font-size:1.2rem;}
    .modal-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;}
    .modal-close:hover{color:var(--text);}
    .modal-fields{display:flex;flex-direction:column;gap:14px;}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .detail-grid{background:var(--surface2);border-radius:10px;padding:16px;
      display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .detail-item .detail-label{font-size:.7rem;color:var(--text2);text-transform:uppercase;margin-bottom:2px;}
    .detail-item .detail-val{font-size:.875rem;}
    .detail-full{grid-column:1/-1;}
    .section-divider{height:1px;background:var(--border);margin:4px 0;}

    /* Toast */
    .toast{position:fixed;bottom:24px;right:24px;z-index:300;
      background:var(--surface2);border:1px solid var(--border);
      border-radius:var(--r);padding:14px 20px;font-size:.875rem;
      transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;
      display:flex;align-items:center;gap:10px;min-width:280px;}
    .toast.show{transform:translateY(0);opacity:1;pointer-events:all;}
    .toast.success{border-color:rgba(16,185,129,.3);}
    .toast.warn{border-color:rgba(245,158,11,.3);}
    .toast.error{border-color:rgba(239,68,68,.3);}

    @media(max-width:768px){
      .layout{grid-template-columns:1fr;}
      .sidebar{position:static;height:auto;}
    }

    .anuncio-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);
      display:flex;align-items:center;justify-content:center;
      z-index:500;backdrop-filter:blur(4px);
      opacity:0;pointer-events:none;transition:opacity .3s;}
    .anuncio-overlay.open{opacity:1;pointer-events:all;}
    .anuncio-box{background:var(--surface);border:1px solid rgba(79,124,255,.3);
      border-radius:20px;padding:32px;width:480px;max-width:92vw;
      display:flex;flex-direction:column;gap:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
      transform:scale(.95);transition:transform .3s;}
    .anuncio-overlay.open .anuncio-box{transform:scale(1);}
    .anuncio-icon{width:48px;height:48px;border-radius:14px;
      background:linear-gradient(135deg,#4f7cff,#7c3aed);
      display:flex;align-items:center;justify-content:center;
      font-size:24px;}
    .anuncio-badge{font-size:.68rem;background:rgba(79,124,255,.15);
      color:var(--accent);padding:3px 10px;border-radius:100px;
      font-weight:600;text-transform:uppercase;letter-spacing:.04em;
      width:fit-content;}
    .anuncio-titulo{font-family:'DM Serif Display',serif;font-size:1.3rem;
      font-weight:400;color:var(--text);}
    .anuncio-desc{font-size:.9rem;color:var(--text2);line-height:1.6;}
    .anuncio-lista{display:flex;flex-direction:column;gap:8px;
      background:var(--surface2);border-radius:12px;padding:14px 16px;}
    .anuncio-item{display:flex;gap:10px;align-items:flex-start;
      font-size:.85rem;color:var(--text2);line-height:1.5;}
    .anuncio-item-icon{flex-shrink:0;font-size:.9rem;margin-top:1px;}
    .anuncio-footer{display:flex;align-items:center;justify-content:space-between;
      padding-top:8px;border-top:1px solid var(--border);}
    .anuncio-dias{font-size:.72rem;color:var(--text3);}
    .anuncio-close{padding:9px 20px;border-radius:10px;
      background:var(--accent);color:#fff;border:none;cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;
      transition:all .2s;}
    .anuncio-close:hover{background:#3a68f0;}
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">
      <span>📋</span>
      <span class="nav-title">Panel Administrativo</span>
      <span class="nav-badge">Reclamos RMN</span>
      <span id="navBadgeEntregar" style="display:none;font-size:.7rem;
        background:rgba(16,185,129,.15);color:var(--success);
        padding:3px 10px;border-radius:100px;font-weight:600;
        animation:pulse 2s infinite"></span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <a href="envios.html" class="nav-analitica-btn">📤 Envíos</a>
      <a href="analitica.html" class="nav-analitica-btn">📊 Analítica</a>
      <button onclick="localStorage.clear();location.reload();"
        style="background:none;border:1px solid #252a38;color:#4f5870;padding:5px 10px;
        border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.72rem;">
        ⚙️ API</button>
      <a href="../index.html" class="nav-back">← Cambiar rol</a>
    </div>
  </nav>

  <div class="layout">
    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar">
      <h2>Nuevo Reclamo</h2>

      <div class="stats-grid" id="statsGrid">
        <div class="stat-box"><div class="spinner" style="margin:auto"></div></div>
        <div class="stat-box"></div><div class="stat-box"></div><div class="stat-box"></div>
      </div>

      <div class="section-divider"></div>

      <div class="field">
        <label>Buscar por DNI del paciente</label>
        <input id="f-dni-buscar" placeholder="Ej: 12345678" type="number"
          oninput="buscarPorDni(this.value)" />
      </div>
      <div id="vinculadoInfo" class="vinculado-info">
        ✅ Turno encontrado — el reclamo se vinculará automáticamente
      </div>
      <div id="historialDni" class="historial-dni"></div>

      <div class="field"><label>Apellido *</label><input id="f-apellido" placeholder="García" /></div>
      <div class="field"><label>Nombre *</label><input id="f-nombre" placeholder="Juan Carlos" /></div>
      <div class="field">
        <label>Estudio *</label>
          <div style="display:flex;gap:6px">
            <input id="f-estudio-input" placeholder="Ej: Cerebro con contraste"
            style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();agregarEstudio()}" />
          <button onclick="agregarEstudio()" type="button"
            style="padding:8px 12px;background:rgba(79,124,255,.15);border:1px solid var(--accent);
            color:var(--accent);border-radius:var(--r);cursor:pointer;font-size:.8rem;
            white-space:nowrap;font-family:'DM Sans',sans-serif">+ Agregar</button>
          </div>
        <div id="estudios-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px"></div>
        <input type="hidden" id="f-estudio" />
      </div>
      <div class="field"><label>Fecha del Estudio *</label><input type="date" id="f-fechaEstudio" /></div>
      <div class="field"><label>Email de contacto (para enviarle el informe)</label>
        <input type="email" id="f-email" placeholder="paciente@ejemplo.com" /></div>

      <div class="section-divider"></div>

      <div>
        <div class="reclamo-tipo-label">Tipo de reclamo *</div>
        <div class="reclamo-tipos" style="margin-top:8px">
          <label class="tipo-check" id="check-informado-wrap" onclick="toggleCheck('informado',this)">
            <input type="checkbox" id="f-reclamo-informado" onclick="event.stopPropagation()" />
            <span class="tipo-check-icon">📄</span>
            <div class="tipo-check-text">
              <span class="tipo-check-title">Sin informe / fuera de fecha</span>
              <span class="tipo-check-desc">El paciente no tiene el informe o está fuera de fecha</span>
            </div>
          </label>
          <label class="tipo-check diagnostico" id="check-diagnostico-wrap" onclick="toggleCheck('diagnostico',this)">
            <input type="checkbox" id="f-reclamo-diagnostico" onclick="event.stopPropagation()" />
            <span class="tipo-check-icon">🔬</span>
            <div class="tipo-check-text">
              <span class="tipo-check-title">Reclamo de diagnóstico</span>
              <span class="tipo-check-desc">El paciente está en desacuerdo con el diagnóstico</span>
            </div>
          </label>
          <label class="tipo-check urgente" id="check-turno-wrap" onclick="toggleCheck('turno',this)">
            <input type="checkbox" id="f-reclamo-turno" onclick="event.stopPropagation()" />
            <span class="tipo-check-icon">🚨</span>
            <div class="tipo-check-text">
              <span class="tipo-check-title">Turno médico próximo</span>
              <span class="tipo-check-desc">El estudio está atrasado y el paciente tiene turno</span>
            </div>
            <div class="turno-fecha-wrap" id="turno-fecha-wrap" onclick="event.stopPropagation()">
              <input type="date" id="f-turno-fecha" style="margin-top:8px" />
            </div>
          </label>
          <label class="tipo-check" id="check-placas-wrap" onclick="toggleCheck('placas',this)">
            <input type="checkbox" id="f-reclamo-placas" onclick="event.stopPropagation()" />
            <span class="tipo-check-icon">🩻</span>
            <div class="tipo-check-text">
              <span class="tipo-check-title">Placas viejas (reimpresión)</span>
              <span class="tipo-check-desc">Pide que se reimpriman placas de un estudio anterior — lo resuelve jefatura</span>
            </div>
            <div class="turno-fecha-wrap" id="placas-detalle-wrap" onclick="event.stopPropagation()">
              <input id="f-placas-detalle" placeholder="Qué placas / de qué estudio y fecha" style="margin-top:8px" />
            </div>
          </label>
        </div>
      </div>

      <div class="field">
        <label>Observaciones</label>
        <textarea id="f-obs" placeholder="Notas adicionales..."></textarea>
      </div>

      <button class="btn btn-primary" id="btnNuevo" onclick="nuevoReclamo()">➕ Cargar Reclamo</button>
      <button class="btn btn-ghost" onclick="limpiarForm()">Limpiar</button>
    </aside>

    <!-- ══ MAIN ══ -->
    <main class="main">
      <!-- Panel Reclamos -->
      <div id="panelReclamos">
        <div id="listaHeader" style="display:flex;align-items:baseline;
          gap:10px;margin-bottom:4px">
          <h2 id="listaTitulo" style="font-family:'DM Serif Display',serif;
            font-size:1.15rem;font-weight:400">Todos los reclamos</h2>
          <span id="listaContador" style="font-size:.8rem;color:var(--text2)"></span>
        </div>
        <div class="top-bar">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input id="buscar" placeholder="Buscar por paciente, estudio o DNI..."
              oninput="filtrarLista()" />
          </div>
          <select class="filter-select" id="filtroOrden" onchange="filtrarLista()">
            <option value="urgente">Urgentes primero</option>
            <option value="reciente">Más reciente</option>
            <option value="retraso">Mayor retraso</option>
            <option value="az">A → Z</option>
          </select>
          <button class="btn-sm btn-sm-gray" onclick="recargar()"
            style="padding:8px 14px">🔄 Actualizar</button>
          <button class="btn-sm btn-sm-gray" onclick="exportarCSV()"
            style="padding:8px 14px" title="Exportar la lista que se ve ahora">⬇️ Exportar CSV</button>
        </div>
        <div class="filters" id="filtroEstadoTabs"></div>
        <div id="btnEntregarTodoWrap" style="display:none;gap:8px;flex-direction:column">
          <button onclick="enviarTodo()"
            style="padding:10px 20px;background:rgba(16,185,129,.12);
            border:1px solid rgba(16,185,129,.3);color:var(--success);
            border-radius:var(--r);cursor:pointer;font-family:'DM Sans',sans-serif;
            font-size:.875rem;font-weight:500;transition:all .2s;width:100%"
            id="btnEntregarTodo">
            ✉️ Enviar todos los informes listos
          </button>
          <button onclick="correrBotInformesTodos()" id="btnCorrerBot"
            style="padding:10px 20px;background:rgba(79,124,255,.12);
            border:1px solid rgba(79,124,255,.3);color:var(--accent);
            border-radius:var(--r);cursor:pointer;font-family:'DM Sans',sans-serif;
            font-size:.875rem;font-weight:500;transition:all .2s;width:100%;display:none">
            🤖 Correr bot de informes
          </button>
        </div>
        <div id="barraSeleccionWrap" style="display:none">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;
            padding:10px 16px;background:rgba(79,124,255,.1);
            border:1px solid rgba(79,124,255,.25);border-radius:var(--r)">
            <span id="barraSeleccionTexto" style="font-size:.85rem;color:var(--accent)"></span>
            <div style="display:flex;gap:8px">
              <button class="btn-sm btn-sm-gray" onclick="cancelarSeleccionRevisar()">Cancelar</button>
              <button class="btn-sm btn-sm-blue" id="btnMarcarSeleccionados"
                onclick="marcarSeleccionadosRevisado()">👁 Marcar como revisado</button>
            </div>
          </div>
        </div>
        <div class="reclamos-list" id="lista">
          <div class="loading"><div class="spinner"></div>Cargando reclamos...</div>
        </div>
        <div class="reclamos-list" id="listaRecitados" style="display:none">
          <div class="loading"><div class="spinner"></div>Cargando...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)cerrarModal()">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <button class="modal-close" onclick="cerrarModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Popup de reclamos resueltos por el médico, sin reconocer -->
  <div class="modal-overlay" id="resueltosOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">✅ El médico informó reclamos</div>
      </div>
      <div id="resueltosOverlayLista" style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px"></div>
      <button class="btn btn-primary" style="width:100%" onclick="confirmarResueltosVistos()">OK, entendido</button>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    let todosLosReclamos = [];
    let recitadosData    = [];
    let editId           = null;
    let turnoVinculado   = null;
    let categoriaActual  = '';
    let subTabRecitados  = 'recitar';
    let filtroEstadoActual = '';
    let ultimaListaRenderizada = [];
    let seleccionadosRevisar = new Set();

    // ── Checkboxes ───────────────────────────────────────────────
    function toggleCheck(tipo, labelEl) {
      const checkbox = labelEl.querySelector('input[type=checkbox]');
      checkbox.checked = !checkbox.checked;
      labelEl.classList.toggle('checked', checkbox.checked);
      if (tipo === 'turno') {
        document.getElementById('turno-fecha-wrap')
          .classList.toggle('visible', checkbox.checked);
      }
      if (tipo === 'placas') {
        document.getElementById('placas-detalle-wrap')
          .classList.toggle('visible', checkbox.checked);
      }
    }

    function getTiposReclamo() {
      const turnoFecha = document.getElementById('f-turno-fecha').value;
      return {
        reclamoInformado:   document.getElementById('f-reclamo-informado').checked   ? 'Si' : '',
        reclamoDiagnostico: document.getElementById('f-reclamo-diagnostico').checked ? 'Si' : '',
        reclamoTurno:       document.getElementById('f-reclamo-turno').checked
          ? (turnoFecha || 'Si') : '',
        reclamoPlacas:      document.getElementById('f-reclamo-placas').checked ? 'Si' : '',
        placasDetalle:      document.getElementById('f-placas-detalle').value.trim(),
      };
    }

    function hayAlgunTipoSeleccionado() {
      return document.getElementById('f-reclamo-informado').checked  ||
             document.getElementById('f-reclamo-diagnostico').checked ||
             document.getElementById('f-reclamo-turno').checked ||
             document.getElementById('f-reclamo-placas').checked;
    }

    // ── Búsqueda DNI ─────────────────────────────────────────────
    let buscarTimer;
    function buscarPorDni(dni) {
      clearTimeout(buscarTimer);
      if (!dni || dni.length < 7) {
        turnoVinculado = null;
        document.getElementById('vinculadoInfo').classList.remove('visible');
        renderHistorialDni([]);
        return;
      }
      buscarTimer = setTimeout(async () => {
        try {
          const todos = await getReclamos({ dni: dni });
          const encontrado = todos && todos.length ? todos[0] : null;

          if (encontrado) {
            turnoVinculado = encontrado;
            document.getElementById('f-apellido').value    = encontrado.apellido  || '';
            document.getElementById('f-nombre').value      = encontrado.nombre    || '';
            // Cargar estudio como chips
            if (encontrado.estudio) {
              estudiosLista = encontrado.estudio.split(',').map(s => s.trim()).filter(Boolean);
              renderEstudiosChips();
            }
            if (encontrado.fechaEstudio)
              document.getElementById('f-fechaEstudio').value = encontrado.fechaEstudio;
            const info = document.getElementById('vinculadoInfo');
            info.classList.add('visible');
            info.textContent = encontrado.archivado
              ? '📦 Turno encontrado (archivado) — el reclamo se vinculará automáticamente'
              : '✅ Turno encontrado — el reclamo se vinculará automáticamente';
          } else {
            turnoVinculado = null;
            document.getElementById('vinculadoInfo').classList.remove('visible');
          }

          renderHistorialDni(todos || []);
        } catch(e) {}
      }, 500);
    }

    function renderHistorialDni(lista) {
      const cont = document.getElementById('historialDni');
      if (!lista.length) {
        cont.classList.remove('visible');
        cont.innerHTML = '';
        return;
      }
      const estadoLabel = {
        pendiente:        'Pendiente',
        resuelto:         'Informado',
        entregado:        'Entregado',
        'revisado-admin':  'Revisado admin',
        recitar:          'Por recitar',
        recitado:         'Recitado',
      };
      cont.innerHTML =
        '<div class="historial-dni-label">Reclamos previos de este DNI (' + lista.length + ')</div>' +
        lista.map(r => `
          <div class="historial-dni-item">
            <div class="hdi-top">
              <span>#${r.nroReclamo || r.id} · ${r.fechaReclamo || r.fechaEstudio || '—'}</span>
              <span>${estadoLabel[r.estado] || r.estado || 'Sin reclamo'}</span>
            </div>
            <div class="hdi-estudio">${r.estudio || ''}</div>
          </div>`).join('');
      cont.classList.add('visible');
    }

    // ── Cargar / recargar ─────────────────────────────────────────
    async function recargar() {
      if (todosLosReclamos.length === 0) {
        document.getElementById('lista').innerHTML =
          '<div class="loading"><div class="spinner"></div>Cargando...</div>';
      }
      try {
        const dash = await getDashboard();

        const ack = getResueltosAck();
        const sinReconocer = dash.list.filter(r => r.estado === 'resuelto' && !ack.has(r.id));
        if (sinReconocer.length > 0) {
          mostrarPopupResueltos(sinReconocer);
        }

        todosLosReclamos = dash.list;
        recitadosData    = dash.recitados;
        filtrarLista();
        cargarStats(dash.stats);
        actualizarBadgeEntregar();
        actualizarBotonCorrerBot();
        if (categoriaActual === 'recitados') renderRecitadosAdmin();

      } catch(e) {
        document.getElementById('lista').innerHTML =
          `<div class="empty"><span>⚠️</span>Error al conectar.<br>
          <small style="color:var(--text3)">${e.message}</small></div>`;
        toast('❌ Error de conexión', 'error');
      }
    }

function cargarStats(s) {
  try {
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-box" onclick="filtrarPorStat('')" style="cursor:pointer" title="Ver todos">
        <div class="stat-num accent">${s.total}</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-box" onclick="filtrarPorStat('pendiente')" style="cursor:pointer" title="Ver pendientes">
        <div class="stat-num warn">${s.pendientes}</div>
        <div class="stat-label">Pendientes</div>
      </div>
      <div class="stat-box" onclick="filtrarPorStat('urgente')" style="cursor:pointer" title="Ver con turno">
        <div class="stat-num danger">${s.urgentes}</div>
        <div class="stat-label">Con turno</div>
      </div>
      <div class="stat-box" onclick="filtrarPorStat('resuelto')" style="cursor:pointer" title="Ver resueltos sin entregar">
        <div class="stat-num success">${s.resueltos}</div>
        <div class="stat-label">Resueltos sin entregar</div>
      </div>
      <div class="stat-box" onclick="filtrarPorStat('recitados')"
        style="cursor:pointer" title="Ver pacientes por recitar">
        <div class="stat-num" style="color:var(--recitar)">
          ${recitadosData.length}
        </div>
        <div class="stat-label">🔄 Por recitar</div>
      </div>
      <div class="stat-box" onclick="filtrarPorStat('revisado-admin')"
        style="cursor:pointer" title="Ver revisados por administrativo">
        <div class="stat-num accent">${s.revisados}</div>
        <div class="stat-label">👁 Revisados admin</div>
      </div>
      <div class="stat-box" onclick="filtrarPorStat('archivado')"
        style="cursor:pointer;grid-column:1/-1;
        border-color:rgba(255,255,255,.08)" title="Ver archivados">
        <div class="stat-num" style="color:var(--text3)">
          ${s.archivados}
        </div>
        <div class="stat-label">📦 Archivados (+3 meses)</div>
      </div>`;
  } catch(e) {}
}

    // ── Recitados admin ───────────────────────────────────────────
    async function loadRecitadosAdmin() {
      const lista = document.getElementById('listaRecitados');
      lista.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';
      try {
        recitadosData = await getRecitados();
        renderRecitadosAdmin();
      } catch(e) {
        lista.innerHTML = `<div class="empty"><span>⚠️</span>Error: ${e.message}</div>`;
      }
    }

    function subFiltrarRecitados(tipo){
      subTabRecitados = tipo;
      document.querySelectorAll('#filtroEstadoTabs [data-subtab]').forEach(function(b){
        b.classList.toggle('active', b.dataset.subtab === tipo);
      });
      renderRecitadosAdmin();
    }

    function renderRecitadosAdmin() {
      const lista = document.getElementById('listaRecitados');

      if (subTabRecitados === 'recitar') {
        ultimaListaRenderizada = recitadosData;
        actualizarListaHeader('recitar', recitadosData.length);
        // Lista de pacientes esperando que se les asigne turno
        if (!recitadosData.length) {
          lista.innerHTML =
            '<div class="empty"><span>✅</span>No hay pacientes pendientes de recitación.</div>';
          return;
        }
        const hoy = new Date().toISOString().split('T')[0];
        lista.innerHTML = recitadosData.map(r => `
          <div class="recitado-admin-card">
            <div class="recitado-admin-header">
              <div class="card-num" style="min-width:auto">#${r.nroReclamo || r.id}</div>
              <div style="flex:1">
                <div style="font-weight:600;font-size:.95rem">${r.apellido}, ${r.nombre}</div>
                <div style="font-size:.78rem;color:var(--text3);margin-top:2px">
                  DNI ${r.dni} · ${r.estudio}
                </div>
                <div style="font-size:.72rem;color:var(--text3);margin-top:2px">
                  Turno original: ${r.fechaEstudio || '—'} · Retraso: ${r.retraso || 0}d
                </div>
              </div>
              <span class="recitado-code-badge">${r.recitarCodigo}</span>
            </div>
            <div class="recitado-motivo-box">
              💬 <strong>Motivo médico:</strong> ${r.recitarMotivo}
            </div>
            <div class="recitado-actions">
              <a class="btn-agenda"
                href="https://jefaturaresonancias.github.io/resonancia-pwa/"
                target="_blank">📅 Abrir Agenda</a>
              <input type="date" class="fecha-rctr" id="fecha-rctr-${r.id}" value="${hoy}" />
              <button class="btn-confirmar-turno" id="btn-conf-${r.id}"
                onclick="confirmarTurnoRecitado('${r.id}')">✔ Confirmar turno</button>
            </div>
          </div>`).join('');

      } else {
        // Lista de pacientes con turno YA asignado (estado === 'recitado')
        const recitadosConTurno = todosLosReclamos.filter(r => r.estado === 'recitado');
        ultimaListaRenderizada = recitadosConTurno;
        actualizarListaHeader('recitado', recitadosConTurno.length);
        if (!recitadosConTurno.length) {
          lista.innerHTML =
            '<div class="empty"><span>📭</span>No hay pacientes con turno reasignado todavía.</div>';
          return;
        }
        lista.innerHTML = recitadosConTurno.map(r => `
          <div class="recitado-admin-card">
            <div class="recitado-admin-header">
              <div class="card-num" style="min-width:auto">#${r.nroReclamo || r.id}</div>
              <div style="flex:1">
                <div style="font-weight:600;font-size:.95rem">${r.apellido}, ${r.nombre}</div>
                <div style="font-size:.78rem;color:var(--text3);margin-top:2px">
                  DNI ${r.dni} · ${r.estudio}
                </div>
              </div>
              <span class="recitado-code-badge">📅 ${r.recitarFechaNuevo || 'turno asignado'}</span>
            </div>
            ${r.recitarMotivo ? `<div class="recitado-motivo-box">
              💬 <strong>Motivo:</strong> ${r.recitarMotivo}</div>` : ''}
          </div>`).join('');
      }
    }

    async function confirmarTurnoRecitado(id) {
      const fechaEl = document.getElementById(`fecha-rctr-${id}`);
      const fecha   = fechaEl ? fechaEl.value : '';
      if (!fecha) { toast('⚠️ Ingresá la fecha del nuevo turno', 'warn'); return; }
      const btn = document.getElementById(`btn-conf-${id}`);
      if (btn) { btn.disabled = true; btn.textContent = '⏳ Guardando...'; }
      try {
        await asignarTurnoRecitado(id, fecha);
        await recargar();
        toast('✅ Turno asignado — el reclamo vuelve a la lista para el médico');
      } catch(e) {
        toast('❌ Error: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✔ Confirmar turno'; }
      }
    }

    // ── Título dinámico de la lista ─────────────────────────────────
    function actualizarListaHeader(estado, cantidad){
      const titulos = {
        '':                'Todos los reclamos',
        'pendiente':        'Pendientes',
        'urgente':          'Urgentes (con turno)',
        'resuelto':         'Resueltos por médico',
        'revisado-admin':   'Revisados por administrativo',
        'entregado':        'Entregados',
        'archivado':        'Archivados (+3 meses)',
        'recitar':          'Por recitar (sin turno asignado)',
        'recitado':         'Recitados (turno ya asignado)',
      };
      document.getElementById('listaTitulo').textContent =
        titulos[estado] !== undefined ? titulos[estado] : 'Reclamos';
      document.getElementById('listaContador').textContent =
        cantidad + ' resultado' + (cantidad !== 1 ? 's' : '');
    }

    // ── Filtro de estado (pestañas planas) ──────────────────────────
    function setFiltroEstado(estado){
      filtroEstadoActual = estado;
      document.querySelectorAll('#filtroEstadoTabs .filter-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.estado === estado);
      });
      document.getElementById('btnEntregarTodoWrap').style.display = estado === 'resuelto' ? 'flex' : 'none';
      if (estado === 'resuelto') actualizarBotonCorrerBot();
      filtrarLista();
    }

    // Muestra "Correr bot de informes" solo cuando hay resueltos cuyo
    // informe todavía no bajó del HIS (informeEstado==='') — si no hay
    // ninguno, no tiene sentido ofrecer el botón.
    function actualizarBotonCorrerBot() {
      const btn = document.getElementById('btnCorrerBot');
      if (!btn) return;
      const pendientesDeBot = todosLosReclamos.filter(
        r => r.estado === 'resuelto' && !r.informeEstado
      ).length;
      btn.style.display = pendientesDeBot > 0 ? '' : 'none';
      btn.textContent = pendientesDeBot > 0
        ? `🤖 Correr bot de informes (${pendientesDeBot} pendiente${pendientesDeBot !== 1 ? 's' : ''})`
        : '🤖 Correr bot de informes';
    }

    // ── Filtrar y renderizar lista ────────────────────────────────
    function filtrarLista() {
      const busq  = (document.getElementById('buscar').value || '').toLowerCase();
      const estado = filtroEstadoActual;
      const orden  = document.getElementById('filtroOrden').value;

      if (estado === 'archivado') {
        document.getElementById('lista').innerHTML =
          '<div class="loading"><div class="spinner"></div>Cargando archivados...</div>';
        getReclamos({ estado: 'archivado' }).then(function(archivados){
          actualizarListaHeader('archivado', (archivados || []).length);
          renderLista(archivados || []);
        }).catch(function(e){
          toast('❌ Error al cargar archivados: ' + e.message, 'error');
        });
        return;
      }

      let data = [...todosLosReclamos].filter(r => !r.archivado);

      if (busq) data = data.filter(r =>
        (r.apellido + ' ' + r.nombre).toLowerCase().includes(busq) ||
        String(r.dni).includes(busq) ||
        (r.estudio || '').toLowerCase().includes(busq));
      if (estado) {
        data = data.filter(r => r.estado === estado);
      } else {
      // Ocultar resueltos y entregados de la lista general
        data = data.filter(r =>
          r.estado !== 'resuelto' &&
          r.estado !== 'entregado' &&
          r.estado !== 'recitado' &&
          r.estado !== 'recitar'
        );
      }

      if (orden === 'urgente') {
        data.sort((a, b) => {
          const aP = a.reclamoTurno && a.estado !== 'recitado' ? 2 :
                     a.estado === 'recitado' ? 1 : 0;
          const bP = b.reclamoTurno && b.estado !== 'recitado' ? 2 :
                     b.estado === 'recitado' ? 1 : 0;
          if (bP !== aP) return bP - aP;
          return (b.retraso || 0) - (a.retraso || 0);
        });
      } else if (orden === 'retraso') {
        data.sort((a, b) => (b.retraso || 0) - (a.retraso || 0));
      } else if (orden === 'az') {
        data.sort((a, b) => a.apellido.localeCompare(b.apellido));
      } else {
        data.sort((a, b) => (b.nroReclamo || 0) - (a.nroReclamo || 0));
      }
      actualizarListaHeader(estado, data.length);
      renderLista(data);
    }

    // ── Exportar CSV ────────────────────────────────────────────────
    function exportarCSV() {
      const data = ultimaListaRenderizada;
      if (!data.length) { toast('⚠️ No hay datos para exportar', 'warn'); return; }

      const columnas = [
        ['nroReclamo', 'N°'], ['apellido', 'Apellido'], ['nombre', 'Nombre'],
        ['dni', 'DNI'], ['estudio', 'Estudio'], ['estado', 'Estado'],
        ['fechaEstudio', 'Fecha turno'], ['fechaReclamo', 'Fecha reclamo'],
        ['reclamoTurno', 'Turno médico'], ['retraso', 'Días retraso'],
        ['comentarioMedico', 'Comentario médico'], ['observaciones', 'Observaciones'],
        ['entregaInforme', 'Entrega informe'], ['fechaEntrega', 'Fecha entrega'],
      ];
      const escapar = v => {
        const s = String(v == null ? '' : v);
        return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const encabezado = columnas.map(c => c[1]).join(';');
      const filas = data.map(r => columnas.map(c => escapar(r[c[0]])).join(';'));
      // Punto y coma como separador y BOM al inicio: así Excel en es-AR
      // (donde la coma es el separador decimal) lo abre bien de una.
      const BOM = String.fromCharCode(0xFEFF);
      const csv = BOM + [encabezado, ...filas].join('\r\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'reclamos_' + new Date().toISOString().split('T')[0] + '.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

function filtrarPorStat(tipo) {
  categoriaActual = tipo;
  const tabsWrap = document.getElementById('filtroEstadoTabs');
  document.getElementById('btnEntregarTodoWrap').style.display = 'none';

  // ── Familia "Recitados": Por recitar / Recitados (turno asignado) ──
  if (tipo === 'recitados') {
    document.getElementById('lista').style.display = 'none';
    document.getElementById('listaRecitados').style.display = '';
    tabsWrap.innerHTML =
      '<button class="filter-btn ' + (subTabRecitados === 'recitar' ? 'active' : '') + '" ' +
        'data-subtab="recitar" onclick="subFiltrarRecitados(\'recitar\')">🔄 Por recitar</button>' +
      '<button class="filter-btn ' + (subTabRecitados === 'recitado' ? 'active' : '') + '" ' +
        'data-subtab="recitado" onclick="subFiltrarRecitados(\'recitado\')">📅 Recitados (turno asignado)</button>';
    loadRecitadosAdmin();
    document.getElementById('panelReclamos').scrollIntoView({ behavior: 'smooth' });
    return;
  }

  document.getElementById('lista').style.display = '';
  document.getElementById('listaRecitados').style.display = 'none';

  // ── Familia "Resueltos": Resueltos sin entregar / Entregados ──
  if (tipo === 'resuelto') {
    tabsWrap.innerHTML =
      '<button class="filter-btn active" data-estado="resuelto" ' +
        'onclick="setFiltroEstado(\'resuelto\')">✅ Resueltos sin entregar</button>' +
      '<button class="filter-btn" data-estado="entregado" ' +
        'onclick="setFiltroEstado(\'entregado\')">📦 Entregados</button>';
    setFiltroEstado('resuelto');
    document.getElementById('panelReclamos').scrollIntoView({ behavior: 'smooth' });
    return;
  }

  // ── Categorías simples, sin sub-pestañas ──
  tabsWrap.innerHTML = '';

  if (tipo === 'urgente') {
    filtroEstadoActual = 'pendiente';
    const data = todosLosReclamos
      .filter(r => r.estado === 'pendiente' && r.reclamoTurno)
      .sort((a, b) => (b.retraso || 0) - (a.retraso || 0));
    actualizarListaHeader('urgente', data.length);
    renderLista(data);
  } else {
    setFiltroEstado(tipo);
  }
  document.getElementById('panelReclamos').scrollIntoView({ behavior: 'smooth' });
}

    async function nuevoReclamo() {
      const apellido     = document.getElementById('f-apellido').value.trim();
      const nombre       = document.getElementById('f-nombre').value.trim();
      const dni          = document.getElementById('f-dni-buscar').value.trim();
      const estudio      = document.getElementById('f-estudio').value.trim();
      const fechaEstudio = document.getElementById('f-fechaEstudio').value;
      if (!apellido || !nombre || !dni || !estudio || !fechaEstudio) {
        toast('⚠️ Completá los campos obligatorios (*)', 'warn'); return;
      }
      if (!hayAlgunTipoSeleccionado()) {
        toast('⚠️ Seleccioná al menos un tipo de reclamo', 'warn'); return;
      }
      const tipos = getTiposReclamo();
      const btn   = document.getElementById('btnNuevo');
      btn.disabled = true; btn.textContent = '⏳ Guardando...';
      try {
        const res = await addReclamo({
          apellido, nombre, dni, estudio, fechaEstudio,
          email: document.getElementById('f-email').value.trim(),
          observaciones: document.getElementById('f-obs').value.trim(),
          ...tipos,
        });
        limpiarForm();
        await recargar();

          ? `✅ Reclamo #${res.nroReclamo} vinculado al turno existente`
          : `✅ Reclamo #${res.nroReclamo} guardado en Google Sheets`);
      } catch(e) {
        toast('❌ Error al guardar: ' + e.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = '➕ Cargar Reclamo';
      }
    }

    // ── Enviar informe por mail ──────────────────────────────────────
    // Reemplaza al viejo "Entregar" (que solo marcaba estado='entregado' sin
    // mandar nada): ahora manda el mail con confirmarEnvioInforme y, si sale
    // bien, además marca entregado — mismo estado final que antes, pero
    // disparado por el envío real en vez de un click sin efecto en el mail.
    async function enviarInforme(id) {
      try {
        await confirmarEnvioInforme(id);
        await entregarReclamo(id);
        await recargar();
        toast('✉️ Informe enviado por mail');
        cerrarModal();
      } catch(e) {
        if (/no tiene email cargado/i.test(e.message)) {
          const email = prompt('Este reclamo no tiene email cargado. Ingresalo para enviar el informe:');
          if (!email) return;
          try {
            await updateReclamo(id, { email: email.trim() });
            await enviarInforme(id);
          } catch (e2) { toast('❌ Error: ' + e2.message, 'error'); }
          return;
        }
        if (/no hay informe cargado/i.test(e.message)) {
          toast('⏳ El bot todavía no bajó este informe. Corriéndolo ahora...', 'warn');
          try {
            await correrBotInformes(id);
            toast('🤖 Bot disparado para este reclamo — probá "Enviar" de nuevo en un rato.');
          } catch (e2) { toast('❌ Error al correr el bot: ' + e2.message, 'error'); }
          return;
        }
        toast('❌ Error: ' + e.message, 'error');
      }
    }

    async function guardarEdicion() {
      const btn = document.getElementById('btnGuardar');
      btn.disabled = true; btn.textContent = '⏳ Guardando...';
      try {
        const turnoChecked = document.getElementById('e-turno').checked;
        const turnoFecha   = document.getElementById('e-turno-fecha').value;
        const cambios = {
          apellido:           document.getElementById('e-apellido').value.trim(),
          nombre:             document.getElementById('e-nombre').value.trim(),
          dni:                document.getElementById('e-dni').value.trim(),
          estudio:            document.getElementById('e-estudio').value.trim(),
          fechaEstudio:       document.getElementById('e-fecha').value,
          reclamoDiagnostico: document.getElementById('e-diagnostico').checked ? 'Si' : '',
          reclamoTurno:       turnoChecked ? (turnoFecha || 'Si') : '',
          reclamoPlacas:      document.getElementById('e-placas').checked ? 'Si' : '',
          placasDetalle:      document.getElementById('e-placas-detalle').value.trim(),
          observaciones:      document.getElementById('e-obs').value.trim(),
          email:              document.getElementById('e-email').value.trim(),
        };
        // RECLAMO_INFORMADO hace doble uso: acá es el checkbox "tipo de
        // reclamo: sin informe", pero bot-informes.js le pone "OK" para
        // avisarle al sistema de alertas de administrativos que un informe
        // está listo para revisar. Si ya está en "OK", no la tocamos desde
        // este modal — si no, se perdería la alerta con cualquier edición
        // de otro campo que no tenga nada que ver.
        const actual = todosLosReclamos.find(x => x.id === editId);
        if (!actual || actual.reclamoInformado !== 'OK') {
          cambios.reclamoInformado = document.getElementById('e-informado').checked ? 'Si' : '';
        }
        await updateReclamo(editId, cambios);
        cerrarModal();
        await recargar();
        toast('✅ Cambios guardados');
      } catch(e) {
        toast('❌ Error: ' + e.message, 'error');
        btn.disabled = false; btn.textContent = '💾 Guardar cambios';
      }
    }

      try {
        await revisadoAdmin(id);
        await recargar();
        toast('👁 Reclamo marcado como revisado');
        cerrarModal();
      } catch(e) { toast('❌ Error: ' + e.message, 'error'); }
    }

    // ── Selección múltiple: marcar varios pendientes como revisado ──
    function toggleSeleccionRevisar(id, checked) {
      if (checked) seleccionadosRevisar.add(id);
      else seleccionadosRevisar.delete(id);
      actualizarBarraSeleccion();
    }

    function actualizarBarraSeleccion() {
      const wrap = document.getElementById('barraSeleccionWrap');
      const n = seleccionadosRevisar.size;
      if (n > 0) {
        wrap.style.display = '';
        document.getElementById('barraSeleccionTexto').textContent =
          n + ' seleccionado' + (n !== 1 ? 's' : '');
      } else {
        wrap.style.display = 'none';
      }
    }

    function cancelarSeleccionRevisar() {
      seleccionadosRevisar.clear();
      document.querySelectorAll('.chk-revisar').forEach(c => { c.checked = false; });
      actualizarBarraSeleccion();
    }

    async function marcarSeleccionadosRevisado() {
      // Re-chequeamos contra el estado actual: si alguno dejo de estar
      // pendiente mientras estaba seleccionado (otro usuario lo cambio),
      // no lo tocamos.
      const ids = [...seleccionadosRevisar].filter(id => {
        const r = todosLosReclamos.find(x => x.id === id);
        return r && r.estado === 'pendiente';
      });
      if (!ids.length) {
        toast('⚠️ Los reclamos seleccionados ya no están pendientes', 'warn');
        seleccionadosRevisar.clear();
        actualizarBarraSeleccion();
        return;
      }
      const btn = document.getElementById('btnMarcarSeleccionados');
      btn.disabled = true; btn.textContent = '⏳ Marcando...';
      try {
        for (const id of ids) {
          await revisadoAdmin(id);
        }
        seleccionadosRevisar.clear();
        await recargar();
        toast(`👁 ${ids.length} reclamo${ids.length > 1 ? 's' : ''} marcado${ids.length > 1 ? 's' : ''} como revisado`);
      } catch(e) {
        toast('❌ Error: ' + e.message, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '👁 Marcar como revisado'; }
        actualizarBarraSeleccion();
      }
    }

    function actualizarBadgeEntregar() {
      const badge  = document.getElementById('navBadgeEntregar');
      const listos = todosLosReclamos.filter(r => r.estado === 'resuelto').length;
      if (listos > 0) {
        badge.textContent = listos + ' para enviar';
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
    }

    // ── Popup de resueltos sin reconocer ──────────────────────────
    const RESUELTOS_ACK_KEY = 'reclamos_resueltos_ack';
    let resueltosSinReconocer = [];

    function getResueltosAck() {
      try { return new Set(JSON.parse(localStorage.getItem(RESUELTOS_ACK_KEY) || '[]')); }
      catch(e) { return new Set(); }
    }

    function mostrarPopupResueltos(reclamos) {
      resueltosSinReconocer = reclamos;
      document.getElementById('resueltosOverlayLista').innerHTML = reclamos.map(r => `
        <div style="background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:.85rem">
          <strong>#${r.nroReclamo || r.id} — ${r.apellido}, ${r.nombre}</strong><br>
          <span style="color:var(--text3)">${r.estudio}</span>
        </div>`).join('');
      document.getElementById('resueltosOverlay').classList.add('open');
    }

    function confirmarResueltosVistos() {
      const ack = getResueltosAck();
      resueltosSinReconocer.forEach(r => ack.add(r.id));
      localStorage.setItem(RESUELTOS_ACK_KEY, JSON.stringify([...ack]));
      resueltosSinReconocer = [];
      document.getElementById('resueltosOverlay').classList.remove('open');
    }

    let estudiosLista = [];

function agregarEstudio() {
  const input = document.getElementById('f-estudio-input');
  const val   = input.value.trim();
  if (!val) return;
  estudiosLista.push(val);
  input.value = '';
  renderEstudiosChips();
  input.focus();
}

function quitarEstudio(idx) {
  estudiosLista.splice(idx, 1);
  renderEstudiosChips();
}

function renderEstudiosChips() {
  const container = document.getElementById('estudios-chips');
  document.getElementById('f-estudio').value = estudiosLista.join(', ');
  container.innerHTML = estudiosLista.map((e, i) => `
    <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
      background:rgba(79,124,255,.12);border:1px solid rgba(79,124,255,.25);
      color:var(--accent);border-radius:100px;font-size:.75rem;">
      ${e}
      <button onclick="quitarEstudio(${i})" type="button"
        style="background:none;border:none;color:var(--accent);cursor:pointer;
        font-size:.9rem;line-height:1;padding:0">×</button>
    </span>`).join('');
}

    // ── Init ──────────────────────────────────────────────────────
    // ── Sistema de anuncios de novedades ──────────────────────
    // Agregá una entrada nueva cada vez que hagas un cambio
    // importante. Se muestra durante 3 días desde 'fecha'.
    const ANUNCIOS = [
      {
        id: 'admin-update-2026-07-27',
        fecha: '2026-07-27', // fecha de publicación (no tocar tras publicar)
        badge: 'Novedades',
        titulo: 'Exportar, auditoría y un dashboard de analítica',
        desc: 'Sumamos herramientas para reportes, más confiabilidad en el backend y una forma de ver tendencias en el tiempo.',
        items: [
          { icono: '⬇️', texto: 'Exportar a CSV la lista que estás viendo (respeta filtro y búsqueda)' },
          { icono: '🔍', texto: 'La búsqueda por DNI ahora muestra el historial completo de reclamos previos del paciente' },
          { icono: '☑️', texto: 'Selección múltiple para marcar varios pendientes como "revisado" de una sola vez' },
          { icono: '📊', texto: 'Nuevo dashboard de Analítica: reclamos por mes, por estudio, por región y tiempo promedio de resolución' },
          { icono: '🔒', texto: 'El backend ahora registra auditoría de cambios y hace backup semanal automático a Drive' },
          { icono: '⚡', texto: 'La app carga más rápido: menos consultas al servidor en cada actualización' },
        ],
      },
      {
        id: 'admin-update-2026-07-26',
        fecha: '2026-07-26', // fecha de publicación (no tocar tras publicar)
        badge: 'Novedades',
        titulo: 'Rediseño del panel administrativo',
        desc: 'Reorganizamos la navegación y sumamos varias mejoras para hacer más simple el seguimiento de reclamos.',
        items: [
          { icono: '📦', texto: 'Archivado automático de reclamos con +3 meses de antigüedad; la búsqueda por DNI ahora también los encuentra' },
          { icono: '🧭', texto: 'Navegación nueva: ya no hay tabs arriba — cada caja del costado izquierdo lleva directo a su categoría (Pendientes, Resueltos, Por recitar, Revisados admin, Archivados, etc.)' },
          { icono: '✅', texto: 'La caja "Resueltos" ahora muestra solo los que faltan entregar, no el total histórico' },
          { icono: '👁️', texto: 'Nueva caja "Revisados admin" para no perder de vista los reclamos ya chequeados' },
          { icono: '🎨', texto: 'Los días de retraso se colorean según gravedad: naranja desde 30 días, rojo desde 90' },
          { icono: '🔔', texto: 'Nuevo aviso cuando el médico informa un reclamo: se agrupan todos en un solo popup y hay que confirmarlo con "OK, entendido" — no se cierra solo' },
        ],
      },
    ];

    function mostrarAnuncioSiCorresponde(){
      const hoy = new Date();
      const activo = ANUNCIOS.find(a => {
        const fechaPub = new Date(a.fecha);
        const diasDesde = Math.floor((hoy - fechaPub) / 86400000);
        return diasDesde >= 0 && diasDesde < 3;
      });
      if (!activo) return;

      const yaVistoKey = 'anuncio_visto_' + activo.id;
      if (sessionStorage.getItem(yaVistoKey)) return;
      sessionStorage.setItem(yaVistoKey, '1');

      const fechaPub = new Date(activo.fecha);
      const diasRestantes = 3 - Math.floor((hoy - fechaPub) / 86400000);

      document.getElementById('anuncioBadge').textContent = activo.badge;
      document.getElementById('anuncioTitulo').textContent = activo.titulo;
      document.getElementById('anuncioDesc').textContent = activo.desc;
      document.getElementById('anuncioLista').innerHTML = activo.items.map(function(it){
        return '<div class="anuncio-item">' +
          '<span class="anuncio-item-icon">' + it.icono + '</span>' +
          '<span>' + it.texto + '</span></div>';
      }).join('');
      document.getElementById('anuncioDias').textContent =
        diasRestantes <= 1
          ? 'Último día que se muestra este aviso'
          : 'Se muestra durante ' + diasRestantes + ' días más';

      document.getElementById('anuncioOverlay').classList.add('open');
    }

    function cerrarAnuncio(){
      document.getElementById('anuncioOverlay').classList.remove('open');
      // No se guarda nada en localStorage a propósito:
      // debe reaparecer en cada carga hasta que pasen los 3 días
    }

    verificarConfig(() => verificarPin(() => {
      recargar();
      mostrarAnuncioSiCorresponde();
      setInterval(recargar, 30000);
    }));

    // Manda el mail de todos los que ya tienen el informe listo
// (informeEstado === 'listo_para_revisar'); los que todavía no lo tienen
// (bot no corrió) se saltean y se cuentan aparte — no tiene sentido
// reintentarlos uno por uno acá, para eso está el botón de correr el bot.
async function enviarTodo() {
  const resueltos = todosLosReclamos.filter(r => r.estado === 'resuelto');
  const listos = resueltos.filter(r => r.informeEstado === 'listo_para_revisar');
  if (!listos.length) {
    toast('⏳ Ninguno tiene el informe listo todavía — corré el bot primero.', 'warn');
    return;
  }
  const btn = document.getElementById('btnEntregarTodo');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';
  let enviados = 0, fallidos = 0;
  try {
    for (const r of listos) {
      try {
        await confirmarEnvioInforme(r.id);
        await entregarReclamo(r.id);
        enviados++;
      } catch (e) { fallidos++; }
    }
    await recargar();
    const salteados = resueltos.length - listos.length;
    toast(`✉️ ${enviados} informe${enviados !== 1 ? 's' : ''} enviado${enviados !== 1 ? 's' : ''}` +
      (fallidos ? ` · ${fallidos} con error` : '') +
      (salteados ? ` · ${salteados} sin informe listo todavía` : ''));
  } finally {
    btn.disabled = false;
    btn.textContent = '✉️ Enviar todos los informes listos';
  }
}

// Dispara bot-informes.js (pasada completa) desde el panel — inserta en
// bot_commands, mismo mecanismo que el panel de bots externo.
async function correrBotInformesTodos() {
  const btn = document.getElementById('btnCorrerBot');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Disparando...'; }
  try {
    await correrBotInformes();
    toast('🤖 Bot de informes disparado — puede tardar unos minutos en verse reflejado.');
  } catch (e) {
    toast('❌ Error: ' + e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🤖 Correr bot de informes'; }
  }
}
    
  </script>

  <div class="anuncio-overlay" id="anuncioOverlay">
    <div class="anuncio-box">
      <div class="anuncio-icon">📢</div>
      <div class="anuncio-badge" id="anuncioBadge">Novedad</div>
      <div class="anuncio-titulo" id="anuncioTitulo"></div>
      <div class="anuncio-desc" id="anuncioDesc"></div>
      <div class="anuncio-lista" id="anuncioLista"></div>
      <div class="anuncio-footer">
        <span class="anuncio-dias" id="anuncioDias"></span>
        <button class="anuncio-close" onclick="cerrarAnuncio()">Entendido</button>
      </div>
    </div>
  </div>
</body>
</html>
