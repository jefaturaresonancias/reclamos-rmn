<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Órdenes escaneadas — Reclamos RMN</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../icon-180.png" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#4f7cff" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0d0f14;--surface:#13161e;--surface2:#1a1e29;--border:#252a38;
      --accent:#4f7cff;--warn:#f59e0b;--danger:#ef4444;--success:#10b981;
      --text:#e8ecf4;--text2:#8892aa;--text3:#4f5870;--r:12px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    nav{display:flex;align-items:center;justify-content:space-between;
      padding:16px 32px;border-bottom:1px solid var(--border);
      background:rgba(13,15,20,.9);backdrop-filter:blur(12px);
      position:sticky;top:0;z-index:100;}
    .nav-brand{display:flex;align-items:center;gap:10px;}
    .nav-title{font-family:'DM Serif Display',serif;font-size:1.1rem;}
    .nav-badge{font-size:.7rem;background:rgba(79,124,255,.15);color:var(--accent);
      padding:3px 10px;border-radius:100px;}
    .nav-back{font-size:.8rem;color:var(--text2);text-decoration:none;transition:color .2s;}
    .nav-back:hover{color:var(--text);}

    .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:16px;}
    .empty{text-align:center;padding:80px 20px;color:var(--text3);}
    .empty .big{font-size:2.6rem;margin-bottom:10px;}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .filtros{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      padding:16px 20px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
    .campo{display:flex;flex-direction:column;gap:5px;}
    .campo label{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;}
    .campo input, .campo select{background:var(--surface2);border:1px solid var(--border);
      border-radius:8px;color:var(--text);font-size:.85rem;padding:8px 10px;
      font-family:'DM Sans',sans-serif;min-width:150px;}
    .campo input:focus, .campo select:focus{outline:none;border-color:var(--accent);}
    .btn{padding:9px 16px;border-radius:8px;border:none;cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;transition:all .2s;}
    .btn-accent{background:var(--accent);color:#fff;}
    .btn-accent:hover{filter:brightness(1.1);}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);}
    .btn-ghost:hover{border-color:var(--text2);color:var(--text);}

    table{width:100%;border-collapse:collapse;background:var(--surface);
      border:1px solid var(--border);border-radius:var(--r);overflow:hidden;font-size:.85rem;}
    thead th{text-align:left;padding:12px 16px;background:var(--surface2);
      color:var(--text2);font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
    tbody td{padding:11px 16px;border-top:1px solid var(--border);}
    tbody tr:hover{background:rgba(255,255,255,.02);}
    .pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;
      padding:3px 10px;border-radius:100px;white-space:nowrap;}
    .pill-ok{background:rgba(16,185,129,.15);color:var(--success);}
    .pill-warn{background:rgba(245,158,11,.15);color:var(--warn);}
    .pill-categoria{background:rgba(79,124,255,.12);color:var(--accent);}
    .link-pdf{color:var(--accent);text-decoration:none;font-weight:500;}
    .link-pdf:hover{text-decoration:underline;}
    .pendiente-drive{color:var(--text3);font-size:.8rem;font-style:italic;}
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">
      <span>🗂️</span>
      <span class="nav-title">Órdenes escaneadas</span>
      <span class="nav-badge" id="contadorBadge">Reclamos RMN</span>
    </div>
    <a href="administrativo.html" class="nav-back" id="linkVolver">← Volver</a>
  </nav>

  <div class="wrap">
    <div class="filtros">
      <div class="campo">
        <label for="filtroFecha">Fecha</label>
        <input type="date" id="filtroFecha">
      </div>
      <div class="campo">
        <label for="filtroCategoria">Región</label>
        <select id="filtroCategoria">
          <option value="">Todas</option>
          <option value="Neuro">Neuro</option>
          <option value="Cuerpo">Cuerpo</option>
          <option value="Musculo">Musculo</option>
        </select>
      </div>
      <button class="btn btn-accent" id="btnBuscar">Buscar</button>
      <button class="btn btn-ghost" id="btnLimpiar">Limpiar filtros</button>
    </div>

    <div id="resultado"><div class="spinner"></div></div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    function pillMatcheo(orden) {
      return orden.matcheoBdRis
        ? '<span class="pill pill-ok">✓ BD_RIS</span>'
        : '<span class="pill pill-warn">⚠ sin matchear</span>';
    }

    function celdaPdf(orden) {
      return orden.driveLink
        ? `<a href="${orden.driveLink}" target="_blank" rel="noopener" class="link-pdf">↗ Ver PDF</a>`
        : '<span class="pendiente-drive">sincronizando…</span>';
    }

    function render(lista) {
      const resultado = document.getElementById('resultado');
      document.getElementById('contadorBadge').textContent =
        lista.length + (lista.length === 1 ? ' orden' : ' órdenes');

      if (!lista.length) {
        resultado.innerHTML = `
          <div class="empty">
            <div class="big">🗂️</div>
            <div>No hay órdenes escaneadas para este filtro</div>
          </div>`;
        return;
      }

      resultado.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>DNI</th><th>Apellido</th><th>Fecha</th><th>Región</th><th>BD_RIS</th><th>PDF</th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(o => `
              <tr>
                <td>${o.dni}</td>
                <td>${o.apellido || '—'}</td>
                <td>${o.fecha}</td>
                <td><span class="pill pill-categoria">${o.categoria}</span></td>
                <td>${pillMatcheo(o)}</td>
                <td>${celdaPdf(o)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }

    async function cargar() {
      const resultado = document.getElementById('resultado');
      resultado.innerHTML = '<div class="spinner"></div>';
      const fecha = document.getElementById('filtroFecha').value;
      const categoria = document.getElementById('filtroCategoria').value;
      try {
        const ordenes = await getOrdenes(fecha, categoria);
        render(ordenes);
      } catch (err) {
        if (err.message === 'PIN inválido') { verificarPin(cargar); return; }
        resultado.innerHTML = `<div class="empty"><div class="big">⚠️</div><div>Error: ${err.message}</div></div>`;
      }
    }

    // Vuelve a la página que trajo hasta acá (Administrativo o Panel
    // Médico) — se llega desde las dos, no siempre desde Administrativo.
    if (document.referrer && document.referrer.includes('medico.html')) {
      const link = document.getElementById('linkVolver');
      link.href = 'medico.html';
      link.textContent = '← Volver al Panel Médico';
    }

    document.getElementById('btnBuscar').addEventListener('click', cargar);
    document.getElementById('btnLimpiar').addEventListener('click', () => {
      document.getElementById('filtroFecha').value = '';
      document.getElementById('filtroCategoria').value = '';
      cargar();
    });

    verificarConfig(() => verificarPin(cargar));
  </script>
</body>
</html>
